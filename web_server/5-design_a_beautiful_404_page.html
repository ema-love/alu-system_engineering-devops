<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f5f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    overflow:hidden;
    color:#111;

}

/* Soft moving orb */

.orb{

    position:absolute;

    width:650px;
    height:650px;

    border-radius:50%;

    background:radial-gradient(circle,
    rgba(255,255,255,.95),
    rgba(220,220,220,.45),
    transparent 72%);

    filter:blur(45px);

    top:-180px;
    right:-120px;

    animation:float 14s ease-in-out infinite;

}

@keyframes float{

0%,100%{
transform:translateY(0px) translateX(0px);
}

50%{
transform:translateY(40px) translateX(-25px);
}

}

/* Film Grain */

body:before{

content:"";

position:fixed;

inset:0;

background-image:
radial-gradient(circle,rgba(0,0,0,.03) 1px,transparent 1px);

background-size:5px 5px;

opacity:.25;

pointer-events:none;

}

/* Main */

.container{

position:relative;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

z-index:2;

}

.card{

max-width:760px;

text-align:center;

animation:fade 1.2s ease;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* Huge outlined number */

.number{

font-size:220px;

font-weight:800;

line-height:1;

color:transparent;

-webkit-text-stroke:2px #d6d6d6;

letter-spacing:-12px;

}

h1{

font-size:48px;

margin-top:-10px;

font-weight:700;

letter-spacing:-2px;

}

.description{

margin-top:25px;

font-size:20px;

line-height:1.8;

color:#6d6d6d;

}

.required{

margin-top:35px;

font-weight:600;

font-size:18px;

color:#111;

}

.line{

width:120px;

height:2px;

background:#111;

margin:45px auto;

opacity:.1;

}

/* Button */

.button{

display:inline-flex;

align-items:center;

gap:12px;

padding:18px 34px;

border-radius:999px;

background:#111;

color:white;

text-decoration:none;

font-weight:600;

transition:.35s;

}

.button:hover{

transform:translateY(-4px);

box-shadow:0 20px 45px rgba(0,0,0,.18);

}

.footer{

margin-top:70px;

font-size:14px;

color:#999;

letter-spacing:.08em;

text-transform:uppercase;

}

.time{

position:fixed;

right:40px;

bottom:35px;

font-size:14px;

color:#9c9c9c;

letter-spacing:.15em;

}

</style>

</head>

<body>

<div class="orb"></div>

<div class="container">

<div class="card">

<div class="number">
404
</div>

<h1>
The internet misplaced something.
</h1>

<p class="description">

The page you requested doesn't exist anymore.<br>
It may have moved, disappeared,<br>
or never existed in the first place.

</p>

<div class="required">

Ceci n'est pas une page

</div>

<div class="line"></div>

<a href="/" class="button">

Return Home →

</a>

<div class="footer">

Designed by Akintayo Erioluwa Mercy

</div>

</div>

</div>

<div class="time" id="clock"></div>

<script>

function updateClock(){

const now=new Date();

const hours=String(now.getHours()).padStart(2,"0");
const minutes=String(now.getMinutes()).padStart(2,"0");

document.getElementById("clock").innerHTML=
hours+":"+minutes;

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
